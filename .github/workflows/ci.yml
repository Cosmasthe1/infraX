name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: infrax
          POSTGRES_USER: infrax
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 20); do
            pg_isready -h localhost -p 5432 -U infrax && break || sleep 1
          done

      - name: Lint control plane
        working-directory: ./control-plane
        run: golangci-lint run ./...

      - name: Lint worker
        working-directory: ./workers
        run: golangci-lint run ./...

      - name: Run unit tests and enforce coverage
        working-directory: ./control-plane
        env:
          DATABASE_URL: postgres://infrax:changeme@localhost:5432/infrax?sslmode=disable
          ADMIN_API_KEY: testkey
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out -covermode=atomic
          echo "Coverage report:"
          go tool cover -func=coverage.out
          # fail if total coverage below 60%
          go tool cover -func=coverage.out | awk '/total/ {sub(/%/,"",$3); if ($3+0 < 60) {print "coverage too low:"$3"%"; exit 1} else {print "coverage OK:"$3"%"}}'

      - name: Run worker tests
        working-directory: ./workers
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability scan (control plane)
        working-directory: ./control-plane
        run: |
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Run vulnerability scan (worker)
        working-directory: ./workers
        run: |
          $(go env GOPATH)/bin/govulncheck ./...

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform/environments/dev init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/dev validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
